name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: POSIX syntax check
        run: |
          sudo apt-get install -y --no-install-recommends dash
          dash -n install.sh
          dash -n tests/smoke.sh
      - name: shellcheck
        run: shellcheck --shell=sh install.sh tests/smoke.sh

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and verify in an Ubuntu container
        run: docker run --rm -v "$PWD:/src:ro" ubuntu:22.04 sh /src/tests/smoke.sh
